          </manifest>
          EOF_SRC
          mkdir -p "$(dirname 'app/src/main/java/com/nosensor/dialer/CallManager.kt')"
          cat > 'app/src/main/java/com/nosensor/dialer/CallManager.kt' <<'EOF_SRC'
          @file:Suppress("DEPRECATION")

          package com.nosensor.dialer

          import android.telecom.Call
          import android.telecom.CallAudioState
          import android.telecom.VideoProfile
          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableIntStateOf
          import androidx.compose.runtime.mutableLongStateOf
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue

          object CallManager {
              var call by mutableStateOf<Call?>(null)
              var state by mutableIntStateOf(Call.STATE_NEW)
              var title by mutableStateOf("")
              var subtitle by mutableStateOf("")
              var muted by mutableStateOf(false)
              var speaker by mutableStateOf(false)
              var connectTime by mutableLongStateOf(0L)
              var service: CallService? = null

              private val callback = object : Call.Callback() {
                  override fun onStateChanged(c: Call, s: Int) = update(c)
                  override fun onDetailsChanged(c: Call, d: Call.Details) = update(c)
              }

              private fun update(c: Call) {
                  state = c.state
                  val num = c.details.handle?.schemeSpecificPart ?: ""
                  val name = c.details.contactDisplayName
                  if (!name.isNullOrBlank()) {
                      title = name; subtitle = num
                  } else {
                      title = num.ifBlank { "Unknown" }; subtitle = ""
                  }
                  if (state == Call.STATE_ACTIVE && connectTime == 0L) connectTime = System.currentTimeMillis()
              }

              fun add(c: Call) {
                  connectTime = 0L
                  call = c
                  c.registerCallback(callback)
                  update(c)
              }

              fun remove(c: Call) {
                  c.unregisterCallback(callback)
                  if (call == c) {
                      call = null
                      state = Call.STATE_DISCONNECTED
                  }
              }

              fun answer() { call?.answer(VideoProfile.STATE_AUDIO_ONLY) }
              fun hangup() {
                  if (state == Call.STATE_RINGING) call?.reject(false, null) else call?.disconnect()
              }
              fun toggleMute() { service?.setMuted(!muted) }
              fun toggleSpeaker() {
                  service?.setAudioRoute(
                      if (speaker) CallAudioState.ROUTE_EARPIECE else CallAudioState.ROUTE_SPEAKER
                  )
              }
          }
          EOF_SRC
          mkdir -p "$(dirname 'app/src/main/java/com/nosensor/dialer/CallService.kt')"
          cat > 'app/src/main/java/com/nosensor/dialer/CallService.kt' <<'EOF_SRC'
          @file:Suppress("DEPRECATION")

          package com.nosensor.dialer

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Intent
          import android.telecom.Call
          import android.telecom.CallAudioState
          import android.telecom.InCallService

          /**
           * This service is the whole reason the proximity sensor is off.
           * Android only turns the screen off near your ear when the in-call UI
           * acquires a PROXIMITY_SCREEN_OFF wake lock. This app never does.
           */
          class CallService : InCallService() {

              override fun onCallAdded(call: Call) {
                  super.onCallAdded(call)
                  CallManager.service = this
                  CallManager.add(call)
                  showUi(call)
              }

              override fun onCallRemoved(call: Call) {
                  super.onCallRemoved(call)
                  CallManager.remove(call)
                  getSystemService(NotificationManager::class.java).cancel(1)
              }

              override fun onCallAudioStateChanged(audioState: CallAudioState) {
                  CallManager.muted = audioState.isMuted
                  CallManager.speaker = audioState.route == CallAudioState.ROUTE_SPEAKER
              }

              private fun showUi(call: Call) {
                  val intent = Intent(this, InCallActivity::class.java)
                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  val pi = PendingIntent.getActivity(
                      this, 0, intent, PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(
                      NotificationChannel("calls", "Calls", NotificationManager.IMPORTANCE_HIGH)
                  )
                  val n = Notification.Builder(this, "calls")
                      .setSmallIcon(android.R.drawable.sym_action_call)
                      .setContentTitle(CallManager.title)
                      .setContentText("Call in progress")
                      .setCategory(Notification.CATEGORY_CALL)
                      .setOngoing(true)
                      .setContentIntent(pi)
                      .setFullScreenIntent(pi, true)
                      .build()
                  nm.notify(1, n)
                  if (call.state != Call.STATE_RINGING) startActivity(intent)
              }
          }
          EOF_SRC
          mkdir -p "$(dirname 'app/src/main/java/com/nosensor/dialer/InCallActivity.kt')"
          cat > 'app/src/main/java/com/nosensor/dialer/InCallActivity.kt' <<'EOF_SRC'
          package com.nosensor.dialer

          import android.graphics.Color as AColor
          import android.os.Bundle
