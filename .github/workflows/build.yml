name: Build dialer APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create project files (first run only)
        if: ${{ hashFiles('app/build.gradle.kts') == '' }}
        run: |
          mkdir -p "$(dirname 'app/build.gradle.kts')"
          cat > 'app/build.gradle.kts' <<'EOF_SRC'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.nosensor.dialer"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.nosensor.dialer"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.core:core-ktx:1.13.1")
          }
          EOF_SRC
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'EOF_SRC'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.READ_CALL_LOG" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />

              <application
                  android:label="Dialer"
                  android:icon="@android:drawable/sym_action_call"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.DIAL" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.DIAL" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:scheme="tel" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="tel" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".InCallActivity"
                      android:exported="false"
                      android:launchMode="singleInstance"
                      android:excludeFromRecents="true" />

                  <service
                      android:name=".CallService"
                      android:exported="true"
                      android:permission="android.permission.BIND_INCALL_SERVICE">
                      <meta-data
                          android:name="android.telecom.IN_CALL_SERVICE_UI"
                          android:value="true" />
                      <intent-filter>
                          <action android:name="android.telecom.InCallService" />
                      </intent-filter>
                  </service>
